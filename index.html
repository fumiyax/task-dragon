<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>レベルアップクエスト</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>⚔️ レベルアップクエスト</h1>
            <p class="date" id="currentDate"></p>
        </header>

        <main>
            <!-- キャラクター情報 -->
            <section class="character-section">
                <div class="character-info">
                    <div class="level-display">
                        <span class="level-label">LV</span>
                        <span class="level-value" id="levelValue">1</span>
                    </div>
                    <div class="title-display">
                        <span class="title-icon" id="titleIcon">⚔️</span>
                        <span class="title-text" id="titleText">見習い剣士</span>
                    </div>
                </div>
                <div class="job-progress">
                    <div class="progress-bar">
                        <div class="progress-fill" id="jobProgressFill"></div>
                    </div>
                    <div class="progress-text">
                        <span id="jobName">剣士</span>: <span id="jobLevel">1</span> / 100
                    </div>
                </div>
            </section>

            <!-- 今日のタスク -->
            <section class="tasks-section">
                <h2>今日のタスク</h2>
                <div class="task-list">
                    <div class="task-item">
                        <label class="task-label">
                            <input type="checkbox" id="morning" class="task-checkbox">
                            <span class="task-icon">🌅</span>
                            <span class="task-name">朝</span>
                        </label>
                    </div>
                    <div class="task-item">
                        <label class="task-label">
                            <input type="checkbox" id="afternoon" class="task-checkbox">
                            <span class="task-icon">☀️</span>
                            <span class="task-name">昼</span>
                        </label>
                    </div>
                    <div class="task-item">
                        <label class="task-label">
                            <input type="checkbox" id="night" class="task-checkbox">
                            <span class="task-icon">🌙</span>
                            <span class="task-name">夜</span>
                        </label>
                    </div>
                </div>
                <div class="today-count">
                    今日: <span id="todayCount">0</span> / 3
                </div>
            </section>

            <!-- 王様の承認 -->
            <section class="stamp-section">
                <h2>👑 王様の承認</h2>
                <div id="stampArea">
                    <button class="stamp-button" id="stampButton">
                        ✨ よくできました！ ✨
                    </button>
                    <p class="stamp-message" id="stampMessage"></p>
                </div>
            </section>

            <!-- ボタン -->
            <div class="button-group">
                <a href="history.html" class="secondary-btn">📜 スタンプ履歴</a>
            </div>
        </main>
    </div>

    <script src="app.js"></script>
</body>
</html>
