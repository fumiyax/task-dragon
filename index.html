<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>レベルアップクエスト</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>⚔️ レベルアップクエスト ver01</h1>
            <div class="date-navigation">
                <button class="date-nav-btn" id="prevDayBtn">←</button>
                <span class="date" id="currentDate"></span>
                <button class="date-nav-btn" id="nextDayBtn">→</button>
                <button class="date-nav-btn today" id="todayBtn">今日</button>
            </div>
        </header>

        <main>
            <!-- キャラクター情報 -->
            <section class="character-section">
                <div class="character-info">
                    <div class="level-display">
                        <span class="level-label">LV</span>
                        <span class="level-value" id="levelValue">1</span>
                    </div>
                    <div class="title-display">
                        <span class="title-icon" id="titleIcon">⚔️</span>
                        <span class="title-text" id="titleText">見習い剣士</span>
                    </div>
                </div>
                <div class="job-progress">
                    <div class="progress-bar">
                        <div class="progress-fill" id="jobProgressFill"></div>
                    </div>
                    <div class="progress-text">
                        <span id="jobName">剣士</span>: <span id="jobLevel">1</span> / 100
                    </div>
                </div>
            </section>

            <!-- タスク一覧 -->
            <section class="daily-tasks-section">
                <h2>今日のタスク</h2>
                <div id="taskList" class="daily-task-list">
                    <div class="loading">読み込み中...</div>
                </div>
                <div class="task-summary" id="taskSummary"></div>
            </section>

            <!-- 王様の承認 -->
            <section class="stamp-section">
                <h2>👑 王様の承認</h2>
                <div id="stampArea">
                    <button class="stamp-button" id="stampButton">
                        ✨ よくできました！ ✨
                    </button>
                    <p class="stamp-message" id="stampMessage"></p>
                </div>
            </section>

            <!-- ボタン -->
            <div class="button-group">
                <a href="history.html" class="secondary-btn">📜 スタンプ履歴</a>
                <a href="manage.html" class="secondary-btn">⚙️ タスク管理</a>
            </div>
        </main>
    </div>

    <!-- 合言葉モーダル（承認用） -->
    <div id="passwordModal" class="modal" style="display: none;">
        <div class="modal-content">
            <h2>👑 王様の合言葉</h2>
            <div class="password-form">
                <input type="tel"
                       id="passwordInput"
                       placeholder="合言葉を入力"
                       class="task-input"
                       inputmode="numeric"
                       pattern="[0-9]*"
                       maxlength="3">
                <div class="modal-buttons">
                    <button id="submitPasswordBtn" class="add-btn">確認</button>
                    <button id="cancelPasswordBtn" class="add-btn">キャンセル</button>
                </div>
                <p class="stamp-message" id="passwordError"></p>
            </div>
        </div>
    </div>

    <!-- 合言葉モーダル（解除用） -->
    <div id="unstampPasswordModal" class="modal" style="display: none;">
        <div class="modal-content">
            <h2>👑 王様の合言葉</h2>
            <div class="password-form">
                <input type="tel"
                       id="unstampPasswordInput"
                       placeholder="合言葉を入力"
                       class="task-input"
                       inputmode="numeric"
                       pattern="[0-9]*"
                       maxlength="3">
                <div class="modal-buttons">
                    <button id="submitUnstampPasswordBtn" class="add-btn">確認</button>
                    <button id="cancelUnstampPasswordBtn" class="add-btn">キャンセル</button>
                </div>
                <p class="stamp-message" id="unstampPasswordError"></p>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
